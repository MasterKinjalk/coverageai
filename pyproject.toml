[project]
name = "coverageai"
version = "0.1.0"
description = "CoverageVision AI: closed-loop precision spraying simulation (ABE 598, Fall 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "streamlit>=1.38",
    "requests>=2.32",
]

[project.optional-dependencies]
vision = [
    "torch>=2.4",
    "torchvision>=0.19",
    "segmentation-models-pytorch>=0.3.4",
]
gpu = [
    "xgboost>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverageai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
